<head>

<style>

  background-size: 60px 60px;

/* Synthesis Dashboard Panel */

/* Flying 3D Showcase Screens */

/* Browser Window (Hold Beat) */

<body>
<div id="stage">
  <div id="grid"></div>
  <div id="seed"></div>

  <!-- Beat 1: Hook Words -->
  <div id="w1" class="abs"><span>Your code</span><span>is not</span><span class="cyan">a PDF.</span></div>

  <!-- Beat 2: Prompt Card -->
  <div id="prompt" class="card">
    <div class="header-tag">Autonomous Portfolio Engine</div>
    <div class="txt"><span id="ptxt"></span><i id="caret"></i></div>
    <div class="row">
      <div class="pill">git commit --all</div>
      <div class="send" id="send">Compile Universe ✦</div>
    </div>
  </div>

  <!-- Beat 3: Synthesis Dashboard Panel -->
  <div id="panel" class="card">
    <h4><span>Portfolio Synthesis</span><small>Neural Evidence · Zero Slop</small></h4>
    <div id="lines"></div>
  </div>

  <!-- Beat 4: Flying Showcase Screens -->
  <div id="screens"></div>

  <!-- Beat 5: Browser Window (Hold Beat) -->
  <div id="win">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url">🔒 https://myfolio.tech/@abdulaziz</div>
    </div>
    <img id="winimg" src="assets/nadia-brand-hero.webp" alt="MyFolio Spatial Viewport">
  </div>

  <!-- Beat 6: Staccato Hits -->
  <div id="stac" class="abs"></div>

  <!-- Beat 7: Final End Card -->
  <div id="end">
    <div class="logo">MyFolio<span>.</span></div>
    <div class="sub">Turn Your Code Into A Living 3D World</div>
    <div class="cta">myfolio.tech ✦ Claim Your Handle</div>
  </div>

  <!-- Cursor -->
  <svg id="cursor" viewBox="0 0 34 44">
    <path d="M4 3 L30 22 L18 24 L26 40 L20 43 L12 27 L4 36 Z" fill="#00f0ff" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
  </svg>
  <div id="hud"></div>
</div>

<script src="look.js"></script>
<script src="motion.js"></script>
<script>
// ────────────────────────────────────────── timeline & config ──────────────────────────────────────────
const FPS = 30, DUR = 15;
window.__meta = { dur: DUR, fps: FPS, w: 1920, h: 1080 };

// Beats (seconds)
const W1 = [0.15, 0.55, 0.95], W1_OUT = 1.60;
const PROMPT_IN = 1.70, TYPE0 = 1.85, TYPE_CPS = 36, CLICK = 3.00, PROMPT_OUT = 3.40;
const PANEL_IN = 3.45, LINE0 = 3.65, LINE_DT = 0.28, PANEL_OUT = 5.20;

const SCREENS = [
  { name: 'rbp-kinetic-monochrome-hero.webp', label: 'RBP Kinetic Monochrome · High Speed Typographic Grid', t: 5.35 },
  { name: 'jack-3d-creator-hero.webp',        label: 'Jack 3D Spatial Studio · Procedural WebGL Materials',  t: 6.45 },
  { name: 'kage-temple-hero.webp',            label: 'Kage Temple · Atmospheric Volumetric Horizon',         t: 7.55 }
];
const SCREEN_HOLD = 0.85;

const WIN_IN = 8.70, WIN_OUT = 11.50; // generous calm hold (~2.8s) for depth and contemplation
const STAC = [
  [11.50, 'ZERO TEMPLATES'],
  [11.95, 'PURE EVIDENCE'],
  [12.40, 'SPATIAL 3D'],
  [12.85, 'YOUR WORLD']
];
const STAC_END = 13.40;
const END_T = 13.40;

const PROMPT_TEXT = 'myfolio compile --profile github.com/abdulaziz';
const LINES = [
  ['Synthesizing git commits & architecture'],
  ['Extracting authentic candidate evidence'],
  ['Building WebGL 3D procedural stages'],
  ['Generating custom typographic hierarchy'],
  ['Verification: 100% PASS · Zero Template Slop', 'pass']
];

// ────────────────────────────────────────── math helpers from motion.js ──────────────────────────────────────────
const { clamp, lerp, sstep, ssstep, spring: spr, spline } = OM;

// ────────────────────────────────────────── DOM setup ──────────────────────────────────────────
const $ = id => document.getElementById(id);
const lineEls = LINES.map(([html, cls]) => {
  const d = document.createElement('div');
  d.className = 'ln' + (cls ? ' ' + cls : '');
  d.innerHTML = `<div class="bx"></div><div class="t">${html}</div>`;
  $('lines').appendChild(d);
  return d;
});

const screenEls = SCREENS.map(s => {
  const d = document.createElement('div');
  d.className = 'screen';
  d.innerHTML = `<img src="assets/${s.name}" alt=""><div class="badge"><i></i>${s.label}</div>`;
  $('screens').appendChild(d);
  s.el = d;
  s.img = d.querySelector('img');
  return d;
});

// Cursor path (one continuous spline causing events)
const SEND_BTN = { x: 520 + 880 - 28 - 90, y: 450 + 180 - 20 - 21 };
const HAND = [
  { t: 0.00, x: 1600, y: 1100 },
  { t: 1.80, x: 1200, y: 800 },
  { t: 2.70, x: SEND_BTN.x + 20, y: SEND_BTN.y + 15 },
  { t: 3.00, x: SEND_BTN.x, y: SEND_BTN.y },
  { t: 3.25, x: SEND_BTN.x, y: SEND_BTN.y },
  { t: 3.70, x: 1400, y: 920 },
  { t: 8.80, x: 1100, y: 650 },
  { t: 10.20, x: 960, y: 520 },
  { t: 11.40, x: 1300, y: 850 },
  { t: 15.00, x: 1500, y: 1100 }
];
const CLICKS = [CLICK];

function place(el, x, y, s = 1, op = 1, blur = 0, extra = '') {
  el.style.opacity = op;
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)}) ${extra}`;
  el.style.filter = blur > 0.2 ? `blur(${blur.toFixed(1)}px)` : 'none';
}

// ────────────────────────────────────────── Pure seek(t) ──────────────────────────────────────────
async function seek(t) {
  const pending = [];

  // Central seed dot / carrier
  const seed = $('seed');
  if (t < PROMPT_IN) {
    const seedRise = OM.wordRise(t, 0.95);
    const pulse = Math.sin(t * 8) * 0.15;
    place(seed, 0, seedRise.y, (1 + pulse) * seedRise.s, t >= 0.95 ? 1 : 0);
  } else if (t < PANEL_IN) {
    // Hidden while prompt card is active
    seed.style.opacity = 0;
  } else if (t < SCREENS[0].t) {
    seed.style.opacity = 0;
  } else {
    seed.style.opacity = 0;
  }

  // 1 · Hook Words
  const w1 = $('w1');
  const out1 = sstep(W1_OUT, W1_OUT + 0.22, t);
  w1.style.opacity = 1 - out1;
  w1.style.transform = `translateY(${(-out1 * 40).toFixed(1)}px)`;
  [...w1.children].forEach((s, i) => {
    const w = OM.wordRise(t, W1[i]);
    s.style.opacity = w.op;
    s.style.transform = `translateY(${w.y.toFixed(1)}px) scale(${w.s.toFixed(4)})`;
  });

  // 2 · Prompt Card
  {
    const el = $('prompt');
    const ei = OM.popIn(t, PROMPT_IN, { zeta: 0.65, omega: 20 });
    const eo = OM.liftOut(t, PROMPT_OUT);
    const vis = t >= PROMPT_IN - 0.05 && t < PROMPT_OUT + 0.25;
    place(el, 0, ei.dy + eo.dy, ei.s * eo.s, vis ? ei.op * eo.op : 0, eo.blur);

    const ty = OM.typeOn(t, TYPE0, PROMPT_TEXT, { cps: TYPE_CPS });
    $('ptxt').textContent = ty.str;
    $('caret').style.opacity = ty.caret;

    const p = OM.press(t, CLICK, { depth: 0.12 });
    $('send').style.transform = `scale(${p.s.toFixed(3)})`;
    $('send').style.background = p.active ? '#10b981' : 'var(--accent)';
  }

  // 3 · Synthesis Dashboard Panel
  {
    const el = $('panel');
    const ei = OM.popIn(t, PANEL_IN, { zeta: 0.68, omega: 18 });
    const eo = OM.liftOut(t, PANEL_OUT);
    const vis = t >= PANEL_IN - 0.05 && t < PANEL_OUT + 0.25;
    place(el, 0, ei.dy + eo.dy, ei.s * eo.s, vis ? ei.op * eo.op : 0, eo.blur);

    lineEls.forEach((ln, i) => {
      const tk = OM.tick(t, LINE0 + i * LINE_DT);
      ln.classList.toggle('on', tk.on);
      ln.querySelector('.bx').style.transform = `scale(${tk.s.toFixed(3)})`;
      const reveal = sstep(PANEL_IN + 0.04 + i * 0.06, PANEL_IN + 0.22 + i * 0.06, t);
      ln.style.opacity = reveal;
    });
  }

  // 4 · Flying Showcase Screens
  SCREENS.forEach(s => {
    const fly = OM.flyThrough(t, s.t, SCREEN_HOLD);
    if (!fly.visible) {
      s.el.style.opacity = 0;
      return;
    }
    s.el.style.opacity = fly.op;
    s.el.style.filter = fly.blur > 0.3 ? `blur(${fly.blur.toFixed(1)}px)` : 'none';
    s.el.style.transform = `translate(${fly.x.toFixed(1)}px,0px) perspective(2000px) rotateY(${fly.rotY.toFixed(2)}deg) rotateX(${fly.rotX}deg) scale(${fly.s.toFixed(4)})`;
  });

  // 5 · Browser Window (Hold Beat: Nadia Brand / Spatial Viewport)
  {
    const el = $('win');
    const vis = t >= WIN_IN && t < WIN_OUT;
    const w = OM.popIn(t, WIN_IN, { zeta: 0.72, omega: 16, rise: 40, s0: 0.94, ds: 0.06 });
    const drift = OM.drift(t, WIN_IN, WIN_OUT, 0.06);
    place(el, 0, w.dy, w.s * drift, vis ? w.op : 0);
  }

  // 6 · Staccato Hits
  {
    const stac = OM.staccato(t, STAC);
    const on = t >= STAC[0][0] && t < STAC_END;
    $('stac').textContent = stac.word;
    $('stac').style.opacity = on ? 1 : 0;
  }

  // 7 · End Card Monolith
  {
    const el = $('end');
    const endOp = sstep(END_T, END_T + 0.28, t);
    el.style.opacity = endOp;
    if (endOp > 0) {
      const zoom = lerp(0.94, 1.0, endOp);
      el.style.transform = `scale(${zoom.toFixed(4)})`;
    }
  }

  // Cursor
  {
    const vis = t >= 1.60 && t < 11.50;
    const cu = OM.cursor(t, HAND, CLICKS);
    $('cursor').style.opacity = vis ? 1 : 0;
    $('cursor').style.transform = `translate(${(cu.x - 4).toFixed(1)}px,${(cu.y - 3).toFixed(1)}px) scale(${cu.s})`;
  }

  $('hud').textContent = `t=${t.toFixed(3)}s · myfolio`;
  return Promise.all(pending);
}

// ────────────────────────────────────────── Motion measurement for shutter blur ──────────────────────────────────────────
window.__motion = function(t0, t1) {
  // Returns maximum on-screen speed (px) across t0..t1 for shutter sampling
  if ((t0 >= 5.0 && t0 <= 8.5) || (t1 >= 5.0 && t1 <= 8.5)) return 450; // flying screens
  if ((t0 >= 11.4 && t0 <= 13.5) || (t1 >= 11.4 && t1 <= 13.5)) return 600; // staccato burst
  if ((t0 >= 1.6 && t0 <= 2.2) || (t1 >= 1.6 && t1 <= 2.2)) return 240; // card pop
  return 80;
};

};

window.__seek = async t => { await seek(t); return true; };
window.__ready = Promise.all([
  window.LOOK ? LOOK.ready : document.fonts.ready,
  ...[...document.querySelectorAll('img')].map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; }))
]).then(() => seek(0));

const q = new URLSearchParams(location.search);
if (q.has('t')) window.__ready.then(() => seek(parseFloat(q.get('t'))));
if (q.has('hud')) $('hud').style.display = 'block';
if (q.has('play')) {
  window.__ready.then(() => {
    const t0 = performance.now();
    (function loop() {
      seek(((performance.now() - t0) / 1000) % DUR);
      requestAnimationFrame(loop);
    })();
  });
}
