<!DOCTYPE html>
<html lang="en">
<head>
  <!-- MyFolio Official Favicon Suite -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Matchstick Mind | MyFolio</title>
  <meta name="description" content="Oops! You've found a missing page on MyFolio. Instead of leaving empty-handed, solve a Matchstick Mind logic puzzle.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Matchstick Mind Game Styles -->
  <link rel="stylesheet" href="/matchstick/matchstick-game.css">

  <style>
    :root {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171817;
      background: #f4f1e8;
      --paper: #f4f1e8;
      --mist: #e4e4e4;
      --ink: #171817;
      --sky: #75c5de;
      --muted: #60615b;
      --border: rgba(23, 24, 23, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: space-between; background: var(--paper); color: var(--ink);
      overflow-x: hidden; position: relative;
    }
    a { color: inherit; text-decoration: none; }

    .site-header {
      padding: 24px 36px; display: flex; justify-content: space-between; align-items: center;
      position: relative; z-index: 10;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 11px;
      font-size: 26px; font-weight: 600; letter-spacing: -0.06em; line-height: 1;
    }
    .brand-logo-wrap { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex-shrink: 0; }
    .brand-logo-img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; display: block; border: 1px solid var(--border); }
    .brand-footer .brand-logo-img { border: 1px solid rgba(255, 255, 255, 0.2); }

    .notfound-main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 30px 20px 50px;
      position: relative; z-index: 2; width: 100%; max-width: 1040px; margin: 0 auto;
    }

    .watermark-404 {
      position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
      font-size: clamp(140px, 24vw, 360px); font-weight: 800; letter-spacing: -0.08em;
      color: rgba(23, 24, 23, 0.035); z-index: -1; user-select: none; pointer-events: none;
    }

    .eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      color: #13708e; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .notfound-title {
      font-size: clamp(32px, 5vw, 56px); font-weight: 700; line-height: 1.15;
      letter-spacing: -0.04em; margin-bottom: 12px; color: var(--ink);
    }
    .notfound-desc {
      font-size: 16px; color: var(--muted); max-width: 540px; line-height: 1.6;
      margin-bottom: 24px;
    }

    .pill-button {
      position: relative; isolation: isolate; display: inline-flex; align-items: center;
      gap: 10px; border-radius: 100px; padding: 6px; color: var(--ink);
      background: transparent; width: max-content;
    }
    .pill-background {
      position: absolute; z-index: -1; left: 6px; top: 6px; bottom: 6px;
      width: calc(100% - 76px); border-radius: 100px; background: #fff;
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .pill-label { padding: 14px 26px; font-size: 14.5px; font-weight: 600; white-space: nowrap; }
    .pill-circle {
      display: flex; width: 48px; height: 48px; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--sky); transition: transform 0.4s ease;
    }
    .pill-button:hover .pill-background { width: calc(100% - 12px); }
    .pill-button:hover .pill-circle { transform: translateX(-4px); }

    .notfound-links {
      display: flex; gap: 24px; margin-top: 24px; font-size: 13px; color: var(--muted);
    }
    .notfound-links a:hover { color: #13708e; text-decoration: underline; }

    .notfound-footer {
      padding: 24px 40px; text-align: center; font-size: 13px; color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="brand" href="/" aria-label="MyFolio home">
      <span class="brand-logo-wrap" aria-hidden="true">
        <img src="/assets/logo-animated.webp" alt="MyFolio logo" class="brand-logo-img" width="34" height="34" style="border-radius:50%; object-fit:cover; display:block;" />
      </span>
      <span>myfolio<span class="brand-period">.</span></span>
    </a>
    <a href="/studio" style="font-size: 13px; font-weight: 500; padding: 8px 18px; border-radius: 100px; background: #fff; border: 1px solid var(--border);">Open studio ↗</a>
  </header>

  <main class="notfound-main">
    <div class="watermark-404">404</div>
    <div class="eyebrow"><span class="status-dot"></span> MISSING SECTOR // 404</div>
    <h1 class="notfound-title">Oops! You've found a missing page.</h1>
    <p class="notfound-desc">Instead of leaving empty-handed, solve a little puzzle: <strong>MATCHSTICK MIND</strong>.</p>

    <!-- Matchstick Mind Interactive Game Mount -->
    <div id="matchstick-game-root" style="width: 100%;"></div>

    <!-- Below Game CTA Section -->
    <div class="mm-section-cta">
      <h3>Think you've got what it takes?</h3>
      <div class="mm-cta-buttons">
        <a class="pill-button" href="/" aria-label="Back to MyFolio">
          <span class="pill-background"></span>
          <span class="pill-label">Back to MyFolio</span>
          <span class="pill-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171817" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
        </a>
        <button type="button" class="mm-btn-restart" onclick="window.matchstickGame && window.matchstickGame.resetGame()" title="Reset game from level 1">
          <span>Play Again ✦</span>
        </button>
      </div>
    </div>

    <div class="notfound-links">
      <a href="/about">Our story</a>
      <a href="/studio">Web Studio</a>
      <a href="/contact">Support</a>
    </div>
  </main>

  <footer class="notfound-footer">
    © 2026 MyFolio • Built by Abdul Aziz Nooruddin
  </footer>

  <!-- Matchstick Mind Game Scripts -->
  <script src="/matchstick/puzzle-engine.js"></script>
  <script src="/matchstick/matchstick-game.js"></script>
</body>
</html>
