<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found (Flat Design Demo)</title>
  <link rel="stylesheet" href="/demo/flat-design.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--flat-bg-subtle);">
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; text-align: center;">
    <div class="flat-card" style="max-width: 520px; padding: 48px; background: var(--flat-surface);">
      <div style="font-size: 5rem; font-weight: 900; line-height: 1; color: var(--flat-gold); margin-bottom: 16px; letter-spacing: -0.05em;">
        404
      </div>
      <div class="flat-badge flat-badge-gray" style="margin-bottom: 16px;">COORDINATES NOT FOUND</div>
      <h1 class="flat-h3" style="font-size: 1.5rem; margin-bottom: 12px;">This page does not exist.</h1>
      <p class="flat-body" style="color: var(--flat-muted); margin-bottom: 32px;">
        The route you navigated to might have been renamed, archived, or is currently undergoing maintenance.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/demo/index.html" class="flat-btn flat-btn-gold">
          <span>Return to Home</span>
        </a>
        <a href="/demo/studio.html" class="flat-btn flat-btn-outline">
          <span>Launch Studio</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Injected Demo Switcher Bar -->
  <script src="/demo/demo-bar.js"></script>
</body>
</html>
