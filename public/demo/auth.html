<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MyFolio (Flat Design Demo)</title>
  <link rel="stylesheet" href="/demo/flat-design.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--flat-bg-subtle);">
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px;">
    <div class="flat-card" style="width: 100%; max-width: 440px; padding: 40px; background: var(--flat-surface);">
      <!-- Brand & Header -->
      <div style="text-align: center; margin-bottom: 32px;">
        <a href="/demo/index.html" class="flat-brand" style="justify-content: center; margin-bottom: 16px;">
          <div class="flat-brand-icon">M</div>
          <span>MyFolio</span>
        </a>
        <h1 class="flat-h3" style="font-size: 1.5rem; margin-bottom: 6px;">Sign in to your account</h1>
        <p class="flat-caption">Access your developer portfolios, source code exports, and analytics.</p>
      </div>

      <!-- Social Logins (Solid 2D Buttons) -->
      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
        <button class="flat-btn flat-btn-outline" style="width: 100%; display: flex; gap: 10px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span>Continue with GitHub</span>
        </button>
        <button class="flat-btn flat-btn-outline" style="width: 100%; display: flex; gap: 10px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <!-- Divider -->
      <div style="display: flex; align-items: center; margin-bottom: 24px; gap: 12px;">
        <div style="flex: 1; height: 1px; background: var(--flat-border);"></div>
        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--flat-subtle); font-weight: 700;">or email</span>
        <div style="flex: 1; height: 1px; background: var(--flat-border);"></div>
      </div>

      <!-- Form -->
      <form onsubmit="event.preventDefault(); window.location.href='/demo/dashboard.html';">
        <div style="margin-bottom: 16px;">
          <label class="flat-label">Email Address</label>
          <input type="email" class="flat-input" placeholder="developer@domain.com" required>
        </div>
        <div style="margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label class="flat-label" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.75rem; color: var(--flat-blue); font-weight: 600;">Forgot password?</a>
          </div>
          <input type="password" class="flat-input" placeholder="••••••••••••" required>
        </div>
        <button type="submit" class="flat-btn flat-btn-gold" style="width: 100%; margin-bottom: 16px;">
          <span>Sign In to Studio</span>
        </button>
      </form>

      <div style="text-align: center; font-size: 0.85rem; color: var(--flat-muted);">
        Don't have an account yet? <a href="/demo/studio.html" style="color: var(--flat-ink); font-weight: 700; text-decoration: underline;">Create one free</a>
      </div>
    </div>
  </div>

  <!-- Injected Demo Switcher Bar -->
  <script src="/demo/demo-bar.js"></script>
</body>
</html>
