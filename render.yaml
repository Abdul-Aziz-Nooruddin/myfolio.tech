services:
  - type: web
    name: myfolio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
      # Outbound SMTP ports (465/587) are blocked on Render free tier.
      # Setting RESEND_API_KEY routes email delivery over HTTPS (port 443).
      - key: RESEND_API_KEY
        sync: false
