<!DOCTYPE html>
<html lang="en">
<head>
  <!-- MyFolio Official Favicon Suite -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Matchstick Mind | MyFolio</title>
  <meta name="description" content="Oops! You've found a missing page on MyFolio. Instead of leaving empty-handed, solve a Matchstick Mind logic puzzle.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Matchstick Mind Game Styles -->
  <link rel="stylesheet" href="/matchstick/matchstick-game.css">

  <style>
    :root {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171817;
      background: #f4f1e8;
      --paper: #f4f1e8;
      --mist: #e4e4e4;
      --ink: #171817;
      --sky: #75c5de;
      --muted: #60615b;
      --border: rgba(23, 24, 23, 0.1);
      --border-strong: rgba(23, 24, 23, 0.2);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      position: relative;
    }

    /* Zero Scroll Desktop Viewport Lock */
    @media (min-width: 960px) and (min-height: 580px) {
      body {
        height: 100vh;
        overflow: hidden;
      }
    }

    a { color: inherit; text-decoration: none; }

    .site-header {
      padding: 12px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
    }
    .brand-logo-wrap { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex-shrink: 0; }
    .brand-logo-img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; display: block; border: 1px solid var(--border); }
    .brand-period { color: #13708e; }

    /* Main Split Section: Zero Scroll Single Section with Elastic Overscroll Physics */
    .notfound-main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
      will-change: transform;
      transform-origin: center center;
    }

    @media (max-width: 960px) {
      .notfound-main {
        grid-template-columns: 1fr;
        padding: 16px 20px 32px;
        gap: 24px;
        overflow-y: visible;
      }
    }

    /* Left Column: Matchstick Mind Game */
    .notfound-col-left {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Right Column: 404 Narrative & Actions */
    .notfound-col-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      padding-left: 8px;
    }

    @media (max-width: 960px) {
      .notfound-col-right {
        align-items: center;
        text-align: center;
        padding-left: 0;
      }
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #13708e;
      margin-bottom: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .huge-404 {
      font-size: clamp(52px, 6vw, 84px);
      font-weight: 800;
      letter-spacing: -0.07em;
      line-height: 0.9;
      color: var(--ink);
      margin: 2px 0 8px;
      user-select: none;
      will-change: transform;
      transform-origin: center center;
    }

    .notfound-title {
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.035em;
      margin-bottom: 6px;
      color: var(--ink);
    }
    .notfound-desc {
      font-size: 14px;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Challenge Action Block */
    .mm-section-cta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
    }
    @media (max-width: 960px) {
      .mm-section-cta {
        align-items: center;
      }
    }

    .mm-section-cta h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin: 0;
    }

    .mm-cta-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-button {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 100px;
      padding: 4px;
      color: var(--ink);
      background: transparent;
      width: max-content;
      transition: all 0.25s ease;
    }
    .pill-background {
      position: absolute;
      z-index: -1;
      left: 4px;
      top: 4px;
      bottom: 4px;
      width: calc(100% - 56px);
      border-radius: 100px;
      background: #fff;
      transition: width 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .pill-label { padding: 9px 18px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .pill-circle {
      display: flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--sky);
      transition: transform 0.35s ease;
    }
    .pill-button:hover .pill-background { width: calc(100% - 8px); }
    .pill-button:hover .pill-circle { transform: translateX(-3px); }

    .mm-btn-restart {
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 100px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--ink);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .mm-btn-restart:hover {
      background: var(--paper);
      border-color: var(--border-strong);
      transform: translateY(-1.5px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .notfound-links {
      display: flex;
      gap: 18px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .notfound-links a:hover { color: #13708e; text-decoration: underline; }

    .notfound-footer {
      padding: 10px 36px;
      text-align: center;
      font-size: 11.5px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

    <a class="brand" href="/" aria-label="MyFolio home">
      <span class="brand-logo-wrap" aria-hidden="true">
        <img src="/assets/logo-3d.png?v=3.9.0" alt="MyFolio logo" class="brand-logo-img" width="30" height="30" style="border-radius:50%; object-fit:cover; display:block;" />
      </span>
      <span>myfolio<span class="brand-period">.</span></span>
    </a>
    <a href="/studio" style="font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 100px; background: #fff; border: 1px solid var(--border);">Open studio ↗</a>
  </header>

  <main class="notfound-main">
    <!-- Left Column: Interactive Matchstick Game -->
    <div class="notfound-col-left">
      <div id="matchstick-game-root" style="width: 100%;"></div>
    </div>

    <!-- Right Column: 404 Narrative & Quick Return Actions -->
    <div class="notfound-col-right">
      <div class="eyebrow" id="notfound-eyebrow"><span class="status-dot"></span> MISSING SECTOR // 404</div>
      <div class="huge-404" id="notfound-code">404</div>
      <h1 class="notfound-title" id="notfound-title">Oops! You've found a missing page.</h1>
      <p class="notfound-desc" id="notfound-desc">Instead of leaving empty-handed, solve this little puzzle: <strong>MATCHSTICK MIND</strong>.</p>

      <div class="mm-section-cta">
        <h3>Think you've got what it takes?</h3>
        <div class="mm-cta-buttons">
          <a class="pill-button" href="/" aria-label="Back to MyFolio">
            <span class="pill-background"></span>
            <span class="pill-label">Back to MyFolio</span>
            <span class="pill-circle">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171817" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </span>
          </a>
          <button type="button" class="mm-btn-restart" onclick="window.matchstickGame && window.matchstickGame.resetGame()" title="Reset game from level 1">
            <span>Play Again ✦</span>
          </button>
        </div>
      </div>

      <div class="notfound-links">
        <a href="/about">Our story</a>
        <a href="/studio">Web Studio</a>
        <a href="/contact">Support</a>
      </div>
    </div>
  </main>

  <footer class="notfound-footer">
    © 2026 MyFolio • Built by Abdul Aziz Nooruddin
  </footer>

  <!-- Matchstick Mind Game Scripts -->
  <script src="/matchstick/puzzle-engine.js"></script>
  <script src="/matchstick/matchstick-game.js"></script>

  <!-- Tactile Overscroll Elastic Rubber-Band Stretch Physics (Smooth 60/120fps) -->
  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const mainEl = document.querySelector('.notfound-main');
      if (!mainEl) return;

      let pullDelta = 0;
      let targetY = 0;
      let currentY = 0;
      let velocity = 0;
      let isInteracting = false;
      let animId = null;
      let idleTimer = null;

      const MAX_STRETCH = 52; // Max displacement in px

      // Apple UIKit asymptotic rubber-band curve (monotonic, zero-clamp resistance)
      function rubberBand(d, limit) {
        const absD = Math.abs(d);
        const y = (absD * limit) / (absD + limit);
        return Math.sign(d) * y;
      }

      function updatePhysics() {
        if (isInteracting) {
          // Zero-lag tracking during active wheel or touch pull
          currentY += (targetY - currentY) * 0.34;
        } else {
          // Smooth critically-damped spring snapback to rest
          const force = (0 - currentY) * 0.16;
          velocity = (velocity + force) * 0.82;
          currentY += velocity;

          if (Math.abs(currentY) < 0.08 && Math.abs(velocity) < 0.08) {
            currentY = 0;
            velocity = 0;
            targetY = 0;
            pullDelta = 0;
            mainEl.style.transform = '';
            animId = null;
            return;
          }
        }

        // Apply single GPU-composited transform from center origin
        const stretch = 1 + Math.abs(currentY) * 0.0006;
        mainEl.style.transform = `translate3d(0, ${currentY.toFixed(2)}px, 0) scale3d(1, ${stretch.toFixed(4)}, 1)`;

        animId = requestAnimationFrame(updatePhysics);
      }

      function wakeLoop() {
        if (!animId) {
          animId = requestAnimationFrame(updatePhysics);
        }
      }

      function addPull(delta) {
        pullDelta += delta;
        targetY = rubberBand(pullDelta, MAX_STRETCH);
        isInteracting = true;
        wakeLoop();

        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          isInteracting = false;
          pullDelta = 0;
          targetY = 0;
        }, 70);
      }

      // Wheel Listener (Trackpad & Mouse Wheel)
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest('.mm-level-select, .mm-hint-box, .mm-overlay-modal')) return;
        // Invert delta so pulling down pulls content upward smoothly
        addPull(-e.deltaY * 0.55);
      }, { passive: true });

      // Touch Listeners (Mobile & Tablet)
      let touchStartY = null;
      let touchLastY = null;

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartY = e.touches[0].clientY;
          touchLastY = touchStartY;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (touchStartY === null || e.touches.length !== 1) return;
        const currentTouchY = e.touches[0].clientY;
        const diff = currentTouchY - touchLastY;
        touchLastY = currentTouchY;
        addPull(diff * 0.85);
      }, { passive: true });

      window.addEventListener('touchend', () => {
        touchStartY = null;
        touchLastY = null;
        isInteracting = false;
        pullDelta = 0;
        targetY = 0;
      }, { passive: true });

      // Tactile Arrow Keys
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          addPull(28);
        } else if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          addPull(-28);
        }
      });
    })();
  </script>

  <!-- Spider Cursor Procedural Engine (Exclusive to 404 page) -->
  <script src="/spider-cursor.js" defer></script>

  <!-- Offline & Typo Adaptation Script -->
  <script>
    (function initOfflineState() {
      function updateState() {
        const isOffline = !navigator.onLine || window.location.search.includes('offline=1');
        const eyebrow = document.getElementById('notfound-eyebrow');
        const code = document.getElementById('notfound-code');
        const title = document.getElementById('notfound-title');
        const desc = document.getElementById('notfound-desc');

        if (isOffline) {
          if (eyebrow) eyebrow.innerHTML = '<span class="status-dot" style="background:#e0a800;"></span> OFFLINE PLAYGROUND // NO INTERNET';
          if (code) code.textContent = 'OFFLINE';
          if (title) title.textContent = "You're currently offline";
          if (desc) desc.innerHTML = 'No internet connection detected. While waiting for your connection to return, enjoy solving <strong>MATCHSTICK MIND</strong> or playing with the procedural <strong>Spider Cursor</strong>!';
        } else {
          if (eyebrow) eyebrow.innerHTML = '<span class="status-dot"></span> MISSING SECTOR // 404';
          if (code) code.textContent = '404';
          if (title) title.textContent = "Oops! You've found a missing page.";
          if (desc) desc.innerHTML = 'Instead of leaving empty-handed, solve this little puzzle: <strong>MATCHSTICK MIND</strong>.';
        }
      }

      window.addEventListener('online', () => {
        updateState();
        const eyebrow = document.getElementById('notfound-eyebrow');
        if (eyebrow) eyebrow.innerHTML = '<span class="status-dot" style="background:#22c55e;"></span> BACK ONLINE // RECONNECTED';
      });
      window.addEventListener('offline', updateState);
      updateState();
    })();
  </script>
</body>
</html>
